services:
  - type: web
    name: acclime-eurotrack
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt && python generate_dataset.py
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
